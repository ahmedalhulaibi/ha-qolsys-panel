sync_weather:
  name: Synchronize weather
  description: Copy a fresh daily forecast to the panel using its local connection. Saves weather-only rollback data in private Qolsys storage.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: qolsys_panel
    weather_entity:
      required: true
      example: weather.forecast_home
      selector:
        entity:
          filter:
            - domain: weather
update_picture_peek_in:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: qolsys_panel
change_master_volume:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: qolsys_panel
    volume:
      required: true
      selector:
        number:
          min: 0
          max: 15
          step: 1
          mode: slider
trigger_police:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          multiple: false
          filter:
            - integration: qolsys_panel
              domain: alarm_control_panel
    silent:
      required: true
      selector:
        boolean:
trigger_auxilliary:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          multiple: false
          filter:
            - integration: qolsys_panel
              domain: alarm_control_panel
    silent:
      required: true
      selector:
        boolean:
trigger_fire:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          multiple: false
          filter:
            - integration: qolsys_panel
              domain: alarm_control_panel
quick_exit:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          multiple: false
          filter:
            - integration: qolsys_panel
              domain: alarm_control_panel
    duration:
      required: false
      default: 120
      selector:
        number:
          min: 1
          max: 600
          unit_of_measurement: seconds
          mode: box
